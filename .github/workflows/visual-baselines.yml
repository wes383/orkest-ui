name: Visual baselines

on:
  workflow_dispatch:

jobs:
  update:
    name: Regenerate snapshots
    # Same image as the Playwright job in ci.yml: snapshots are only comparable when the
    # renderer, fonts and system libraries are identical.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build

      - name: Build documentation site
        run: pnpm --filter @orkest/docs exec next build

      - name: Update snapshots
        run: pnpm test:visual:update

      - name: Upload snapshots
        uses: actions/upload-artifact@v7
        with:
          name: visual-snapshots
          path: tests/visual.spec.ts-snapshots/
          retention-days: 7
