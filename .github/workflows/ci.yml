name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm check:audit

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Check docs samples
        run: pnpm check:docs-samples

      - name: Type-check
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build library
        run: pnpm build

      - name: Build documentation site
        # The library is already built above, so skip the prebuild rebuild.
        run: pnpm --filter @orkest/docs exec next build

  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build

      - name: Check package publishing metadata and types
        run: pnpm check:published

      - name: Verify the packed package in a consumer
        run: node scripts/smoke-package.mjs

  react:
    name: React ${{ matrix.react }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        react: ['18', '19']
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The peer range covers React 18 while the workspace installs 19, so the suite
      # would otherwise never run against the older major.
      - name: Pin React 18 for the compatibility leg
        if: matrix.react == '18'
        run: pnpm --filter @orkest/ui add -D react@^18.3.1 react-dom@^18.3.1

      - name: Test
        run: pnpm --filter @orkest/ui test

  playwright:
    name: Playwright
    # Snapshots are generated in the Playwright image and compared in the same image; running
    # outside it rounds subpixel layout differently and fails every snapshot by one pixel.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build

      - name: Build documentation site
        run: pnpm --filter @orkest/docs exec next build

      - name: Run Playwright
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
